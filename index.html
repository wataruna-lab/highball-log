<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Highball Lab.</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #ffb300; /* Amber */
            --primary-variant: #ff8f00;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --border-color: #333333;
            --danger-color: #ff5252;
            --warning-color: #ffb300;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px; /* For bottom nav */
        }

        header {
            background-color: var(--surface-color);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            letter-spacing: 1px;
            font-family: serif;
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Card Styles */
        .card {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card-title {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Result Display */
        .result-display {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .result-abv {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-color);
            line-height: 1;
        }

        .result-abv span {
            font-size: 1.2rem;
        }

        .result-detail {
            color: var(--text-sub);
            margin-top: 8px;
            font-size: 0.9rem;
        }

        /* Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .control-label {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .control-value {
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary-color);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        /* Buttons */
        .btn-craft {
            width: 100%;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-craft:active {
            opacity: 0.8;
        }

        /* Form Inputs */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-field {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .input-field::placeholder {
            color: var(--text-sub);
        }

        .btn-add {
            background-color: var(--surface-color);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        /* Today's Intake Section */
        .intake-summary {
            text-align: center;
            padding: 10px 0;
        }
        
        .intake-amount {
            font-size: 2.5rem;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        
        .intake-amount span {
            font-size: 1rem;
            font-weight: normal;
        }
        
        .intake-message {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: none;
        }

        /* List Items */
        .log-list {
            list-style: none;
            margin-top: 16px;
        }

        .log-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-info h3 {
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .log-info p {
            font-size: 0.8rem;
            color: var(--text-sub);
        }
        
        .log-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .log-amount {
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .btn-delete {
            background: none;
            border: none;
            color: var(--text-sub);
            padding: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-delete:hover {
            color: var(--danger-color);
        }
        
        /* History Headers */
        .history-date-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 4px 8px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }
        
        .history-date {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-main);
        }
        
        .history-total {
            font-weight: bold;
            font-size: 1rem;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: var(--surface-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            color: var(--text-sub);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .nav-item i {
            font-size: 1.25rem;
        }

        /* Tabs */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }
        
        .modal-title {
            margin-bottom: 16px;
            font-size: 1.1rem;
        }
        
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        
        .btn-modal {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-cancel {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        
        .btn-confirm {
            background-color: var(--danger-color);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Highball Lab.</h1>
    </header>

    <div class="container">
        
        <!-- HOME TAB (Calculator & Today) -->
        <div id="tab-home" class="tab-content active">
            
            <!-- Calculator Card -->
            <div class="card">
                <div class="card-title">
                    <i class="fa-solid fa-flask"></i> Simulator
                </div>
                
                <div class="result-display">
                    <div class="result-abv" id="display-abv">8.0<span>%</span></div>
                    <div class="result-detail">
                        総量: <span id="display-total">150</span>ml / 純アルコール: <span id="display-alcohol-g">9.6</span>g
                    </div>
                </div>

                <div class="control-group">
                    <div class="control-header">
                        <span class="control-label">ウイスキー度数</span>
                        <span class="control-value"><span id="val-whiskey-abv">40</span>%</span>
                    </div>
                    <input type="range" id="slider-whiskey-abv" min="30" max="50" step="1" value="40">
                </div>

                <div class="control-group">
                    <div class="control-header">
                        <span class="control-label">ウイスキーの量</span>
                        <span class="control-value"><span id="val-whiskey-vol">30</span>ml</span>
                    </div>
                    <input type="range" id="slider-whiskey-vol" min="10" max="150" step="5" value="30">
                </div>

                <div class="control-group">
                    <div class="control-header">
                        <span class="control-label">炭酸水の量</span>
                        <span class="control-value"><span id="val-soda-vol">120</span>ml</span>
                    </div>
                    <input type="range" id="slider-soda-vol" min="20" max="500" step="10" value="120">
                </div>

                <button class="btn-craft" onclick="craftHighball()">
                    <i class="fa-solid fa-martini-glass-citrus"></i> Craft
                </button>
            </div>
            
            <!-- Free Entry Card -->
            <div class="card">
                <div class="card-title">
                    <i class="fa-solid fa-beer-mug-empty"></i> Free Record
                </div>
                <div class="input-group">
                    <input type="text" id="free-name" class="input-field" placeholder="名称 (例: 缶ハイボール)" style="flex: 2;">
                </div>
                <div class="input-group">
                    <input type="number" id="free-abv" class="input-field" placeholder="度数 (%)" step="0.1">
                    <input type="number" id="free-vol" class="input-field" placeholder="量 (ml)">
                </div>
                <button class="btn-add" onclick="addFreeRecord()">Add Record</button>
            </div>

            <!-- Today's Record Card -->
            <div class="card">
                <div class="card-title">
                    <i class="fa-solid fa-clipboard-list"></i> Today's Log
                </div>
                
                <div class="intake-summary">
                    <div class="control-label">純アルコール摂取量</div>
                    <div class="intake-amount" id="today-total-g">0.0<span>g</span></div>
                    <div id="intake-message" class="intake-message"></div>
                </div>

                <ul class="log-list" id="today-list">
                    <!-- Today's items will be injected here -->
                </ul>
            </div>
        </div>

        <!-- HISTORY TAB -->
        <div id="tab-history" class="tab-content">
            <div class="card">
                <div class="card-title">
                    <i class="fa-solid fa-calendar-days"></i> History (Past 30 Days)
                </div>
                <div id="history-container">
                    <!-- History items (Grouped by date) will be injected here -->
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="switchTab('history')">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>History</span>
        </div>
    </nav>
    
    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-content">
            <div class="modal-title">この記録を削除しますか？</div>
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="closeModal()">NO</button>
                <button class="btn-modal btn-confirm" id="confirm-delete-btn">YES</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let logs = [];
        let itemToDelete = null;

        function loadLogs() {
            const saved = localStorage.getItem('highballLogs');
            if (saved) {
                logs = JSON.parse(saved);
                cleanOldLogs();
            }
            updateUI();
        }

        function saveLogs() {
            localStorage.setItem('highballLogs', JSON.stringify(logs));
            updateUI();
        }

        // --- Logic: 30-Hour Clock & 30-Day Retention ---
        function getLogicalDateStr(dateObj = new Date()) {
            const d = new Date(dateObj);
            if (d.getHours() < 6) {
                d.setDate(d.getDate() - 1);
            }
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function cleanOldLogs() {
            const todayLogical = new Date(getLogicalDateStr());
            const thirtyDaysAgo = new Date(todayLogical);
            thirtyDaysAgo.setDate(todayLogical.getDate() - 30);
            
            logs = logs.filter(log => {
                const logDate = new Date(getLogicalDateStr(new Date(log.timestamp)));
                return logDate >= thirtyDaysAgo;
            });
        }

        function calcAlcoholGrams(vol, abv) {
            return (vol * (abv / 100) * 0.8).toFixed(1);
        }

        // --- Calculator Interactions ---
        const sliders = {
            wAbv: document.getElementById('slider-whiskey-abv'),
            wVol: document.getElementById('slider-whiskey-vol'),
            sVol: document.getElementById('slider-soda-vol')
        };
        const displays = {
            wAbv: document.getElementById('val-whiskey-abv'),
            wVol: document.getElementById('val-whiskey-vol'),
            sVol: document.getElementById('val-soda-vol'),
            resultAbv: document.getElementById('display-abv'),
            resultTotal: document.getElementById('display-total'),
            resultGrams: document.getElementById('display-alcohol-g')
        };
// ↓↓↓これをまるごと追加（保存された数値をスライダーにセットする関数）↓↓↓
        function loadSliderState() {
            const saved = localStorage.getItem('highballSliders');
            if (saved) {
                const state = JSON.parse(saved);
                if (state.wAbv) sliders.wAbv.value = state.wAbv;
                if (state.wVol) sliders.wVol.value = state.wVol;
                if (state.sVol) sliders.sVol.value = state.sVol;
            }
        }
        function calculateHighball() {
            const wAbv = parseFloat(sliders.wAbv.value);
            const wVol = parseFloat(sliders.wVol.value);
            const sVol = parseFloat(sliders.sVol.value);

            displays.wAbv.textContent = wAbv;
            displays.wVol.textContent = wVol;
            displays.sVol.textContent = sVol;

            const totalVol = wVol + sVol;
            const finalAbv = ((wVol * wAbv) / totalVol).toFixed(1);
            const pureAlcohol = calcAlcoholGrams(totalVol, finalAbv);

            displays.resultAbv.innerHTML = `${finalAbv}<span>%</span>`;
            displays.resultTotal.textContent = totalVol;
            displays.resultGrams.textContent = pureAlcohol;

            // ↓↓↓ここを追加（数値をLocal Storageに保存）↓↓↓
            localStorage.setItem('highballSliders', JSON.stringify({ wAbv, wVol, sVol }));
        }

        Object.values(sliders).forEach(slider => {
            slider.addEventListener('input', calculateHighball);
        });

        // --- Actions ---
        function craftHighball() {
            const wVol = parseFloat(sliders.wVol.value);
            const sVol = parseFloat(sliders.sVol.value);
            const totalVol = wVol + sVol;
            const finalAbv = parseFloat(displays.resultAbv.innerText);
            const grams = parseFloat(displays.resultGrams.textContent);

            const newLog = {
                id: Date.now().toString(),
                timestamp: new Date().toISOString(),
                name: "Craft Highball",
                abv: finalAbv,
                vol: totalVol,
                grams: grams,
                type: 'craft'
            };

            logs.push(newLog);
            saveLogs();
        }

        function addFreeRecord() {
            const name = document.getElementById('free-name').value || '未設定のお酒';
            const abv = parseFloat(document.getElementById('free-abv').value);
            const vol = parseFloat(document.getElementById('free-vol').value);

            if (isNaN(abv) || isNaN(vol)) {
                alert("度数と量を入力してください");
                return;
            }

            const grams = parseFloat(calcAlcoholGrams(vol, abv));
            const newLog = {
                id: Date.now().toString(),
                timestamp: new Date().toISOString(),
                name: name,
                abv: abv,
                vol: vol,
                grams: grams,
                type: 'free'
            };

            logs.push(newLog);
            saveLogs();
            
            document.getElementById('free-name').value = '';
            document.getElementById('free-abv').value = '';
            document.getElementById('free-vol').value = '';
        }
        
        // --- Delete Modal Logic ---
        function requestDelete(id) {
            itemToDelete = id;
            document.getElementById('delete-modal').style.display = 'flex';
        }
        
        function closeModal() {
            itemToDelete = null;
            document.getElementById('delete-modal').style.display = 'none';
        }
        
        document.getElementById('confirm-delete-btn').addEventListener('click', () => {
            if (itemToDelete) {
                logs = logs.filter(log => log.id !== itemToDelete);
                saveLogs();
                closeModal();
            }
        });
    // --- Helper for creating log item HTML ---
        function createLogElement(log) {
            const d = new Date(log.timestamp);
            const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            
            const li = document.createElement('li');
            li.className = 'log-item';
            li.innerHTML = `
                <div class="log-info">
                    <h3>${log.name}</h3>
                    <p>${timeStr} • ${log.type === 'craft' ? '自家製' : '手動登録'} • ${log.abv}% • ${log.vol}ml</p>
                </div>
                <div class="log-right">
                    <div class="log-amount">${log.grams}g</div>
                    <button class="btn-delete" onclick="requestDelete('${log.id}')"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `;
            return li;
        }

        // --- UI Updating ---
        function updateUI() {
            const todayLogicalStr = getLogicalDateStr();
            const todayList = document.getElementById('today-list');
            const historyContainer = document.getElementById('history-container');
            
            todayList.innerHTML = '';
            historyContainer.innerHTML = '';
            
            // Group logs by Logical Date
            const groupedLogs = {};
            const sortedLogs = [...logs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            sortedLogs.forEach(log => {
                const logicalStr = getLogicalDateStr(new Date(log.timestamp));
                if (!groupedLogs[logicalStr]) {
                    groupedLogs[logicalStr] = { totalGrams: 0, items: [] };
                }
                groupedLogs[logicalStr].totalGrams += log.grams;
                groupedLogs[logicalStr].items.push(log);
            });

            // 1. Render Today's List
            let todayTotalGrams = 0;
            if (groupedLogs[todayLogicalStr]) {
                todayTotalGrams = groupedLogs[todayLogicalStr].totalGrams;
                groupedLogs[todayLogicalStr].items.forEach(log => {
                    todayList.appendChild(createLogElement(log));
                });
            }
            if (todayList.innerHTML === '') {
                todayList.innerHTML = '<li class="log-item" style="justify-content:center; color: var(--text-sub);">まだ記録がありません</li>';
            }
            updateIntakeMeter(todayTotalGrams);

            // 2. Render History List
            const sortedDates = Object.keys(groupedLogs).sort((a, b) => new Date(b) - new Date(a));
            
            if (sortedDates.length === 0) {
                historyContainer.innerHTML = '<ul class="log-list"><li class="log-item" style="justify-content:center; color: var(--text-sub);">まだ記録がありません</li></ul>';
            } else {
                sortedDates.forEach(dateStr => {
                    const group = groupedLogs[dateStr];
                    const [yyyy, mm, dd] = dateStr.split('-');
                    const displayDate = `${parseInt(mm)}/${parseInt(dd)}`;
                    
                    let colorVar = 'var(--text-main)';
                    if (group.totalGrams >= 40) colorVar = 'var(--danger-color)';
                    else if (group.totalGrams >= 20) colorVar = 'var(--warning-color)';

                    // Header
                    const header = document.createElement('div');
                    header.className = 'history-date-header';
                    header.innerHTML = `
                        <span class="history-date">${displayDate}</span>
                        <span class="history-total" style="color: ${colorVar}">計 ${group.totalGrams.toFixed(1)}g</span>
                    `;
                    historyContainer.appendChild(header);

                    // Items for this date
                    const ul = document.createElement('ul');
                    ul.className = 'log-list';
                    ul.style.marginTop = '0';
                    group.items.forEach(log => {
                        ul.appendChild(createLogElement(log));
                    });
                    historyContainer.appendChild(ul);
                });
            }
        }

        function updateIntakeMeter(grams) {
            const display = document.getElementById('today-total-g');
            const msgBox = document.getElementById('intake-message');
            
            grams = parseFloat(grams.toFixed(1));
            display.innerHTML = `${grams}<span>g</span>`;
            
            msgBox.style.display = 'block';

            if (grams >= 40) {
                display.style.color = 'var(--danger-color)';
                msgBox.style.backgroundColor = 'rgba(255, 82, 82, 0.1)';
                msgBox.style.border = '1px solid var(--danger-color)';
                msgBox.style.color = 'var(--danger-color)';
                msgBox.innerHTML = '🛑 限界ライン（40g）到達！<br>本日のCraftはここまで。あとはゆっくり休みましょう。';
            } else if (grams >= 20) {
                display.style.color = 'var(--warning-color)';
                msgBox.style.backgroundColor = 'rgba(255, 179, 0, 0.1)';
                msgBox.style.border = '1px solid var(--warning-color)';
                msgBox.style.color = 'var(--warning-color)';
                msgBox.innerHTML = '⚠️ 適量（20g）をオーバーしました。<br>チェイサーを挟んで、そろそろスローペースに。';
            } else {
                display.style.color = 'var(--text-main)';
                msgBox.style.backgroundColor = 'transparent';
                msgBox.style.border = '1px solid var(--border-color)';
                msgBox.style.color = 'var(--text-sub)';
                
                if (grams === 0) msgBox.style.display = 'none';
                else msgBox.innerHTML = '🥃 今日も良いお酒を。';
            }
        }

        // --- Navigation ---
        function switchTab(tabId) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // Initialize
        loadSliderState(); // ←これを追加（計算より前に読み込む）
        calculateHighball();
        loadLogs();
