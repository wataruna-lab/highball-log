<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Highball Craft & Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Tailwind gray-900 */
            color: #f3f4f6; /* Tailwind gray-100 */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        /* Custom Range Slider Styling for Amber Theme */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #f59e0b; /* Amber-500 */
            cursor: pointer;
            margin-top: -9px;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #374151; /* Gray-700 */
            border-radius: 4px;
        }
        input[type=range]:focus {
            outline: none;
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        
        .nav-btn { color: #6b7280; transition: color 0.2s, transform 0.2s; }
        .nav-btn.active { color: #f59e0b; }
        .nav-btn:active { transform: scale(0.9); }

        .craft-btn:active { transform: scale(0.95); }
        .del-btn { transition: color 0.2s, transform 0.1s; }
        .del-btn:active { transform: scale(0.8); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }

        /* Modal Transitions */
        .modal-active { opacity: 1 !important; pointer-events: auto !important; }
        .modal-scale-active { transform: scale(1) !important; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-gray-900 text-gray-100">

    <!-- Header -->
    <header class="bg-gray-800 text-center py-4 shadow-[0_4px_10px_rgba(0,0,0,0.3)] z-20 flex-shrink-0 relative">
        <h1 class="text-xl font-extrabold text-amber-500 tracking-wider flex items-center justify-center gap-2">
            <i class="fa-solid fa-glass-whiskey"></i> CRAFT & LOG
        </h1>
        <!-- Local storage indicator -->
        <div class="absolute right-4 top-1/2 transform -translate-y-1/2 text-xs text-gray-500 font-bold border border-gray-600 px-2 py-1 rounded-md">
            LOCAL
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow overflow-y-auto pb-24 p-4 relative w-full max-w-md mx-auto" id="main-content">
        
        <!-- SECTION 1: Home / Calculator -->
        <section id="section-home" class="tab-content active">
            
            <!-- Highball Calculator -->
            <div class="bg-gray-800 rounded-3xl p-6 shadow-lg border border-gray-700/50 mb-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-600 to-amber-300"></div>
                <h2 class="text-lg font-bold mb-5 text-gray-200 flex justify-between items-end">
                    <span>ハイボール調合室</span>
                    <span class="text-xs font-normal text-amber-500 uppercase tracking-widest">Highball</span>
                </h2>
                
                <!-- Output Display -->
                <div class="bg-gray-900 rounded-2xl p-5 text-center mb-8 shadow-inner border border-gray-700/50 relative">
                    <div class="text-sm text-gray-400 mb-1 font-semibold">出来上がり度数</div>
                    <div class="text-5xl font-extrabold text-amber-400 mb-3 tracking-tighter" id="calc-abv-display">8.0 <span class="text-xl font-normal text-gray-400">%</span></div>
                    <div class="flex justify-center gap-6 text-sm text-gray-300">
                        <div class="bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">総量 <span id="calc-total-display" class="font-bold text-white ml-1">150</span> ml</div>
                        <div class="bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700 text-amber-500">純アル <span id="calc-pure-display" class="font-bold text-amber-400 ml-1">9.6</span> g</div>
                    </div>
                </div>

                <!-- Sliders -->
                <div class="space-y-6">
                    <!-- Whiskey ABV -->
                    <div>
                        <div class="flex justify-between text-sm mb-3">
                            <label class="text-gray-400 font-semibold flex items-center gap-2"><i class="fa-solid fa-percent text-amber-600"></i> ウイスキー度数</label>
                            <span class="text-white font-bold"><span id="val-w-abv">40</span> %</span>
                        </div>
                        <input type="range" id="slider-w-abv" min="37" max="55" value="40" step="1">
                    </div>
                    <!-- Whiskey Volume -->
                    <div>
                        <div class="flex justify-between text-sm mb-3">
                            <label class="text-gray-400 font-semibold flex items-center gap-2"><i class="fa-solid fa-droplet text-amber-600"></i> ウイスキー量</label>
                            <span class="text-white font-bold"><span id="val-w-vol">30</span> ml</span>
                        </div>
                        <input type="range" id="slider-w-vol" min="10" max="100" value="30" step="5">
                    </div>
                    <!-- Soda Volume -->
                    <div>
                        <div class="flex justify-between text-sm mb-3">
                            <label class="text-gray-400 font-semibold flex items-center gap-2"><i class="fa-solid fa-water text-blue-400"></i> 炭酸水量</label>
                            <span class="text-white font-bold"><span id="val-s-vol">120</span> ml</span>
                        </div>
                        <input type="range" id="slider-s-vol" min="50" max="350" value="120" step="10">
                    </div>
                </div>

                <!-- Craft Button -->
                <button id="btn-craft" class="craft-btn w-full mt-8 bg-gradient-to-r from-amber-600 to-amber-400 hover:from-amber-500 hover:to-amber-300 text-gray-900 font-black text-xl py-4 rounded-2xl shadow-[0_4px_20px_rgba(245,158,11,0.3)] transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-martini-glass-citrus text-2xl"></i> CRAFT
                </button>
            </div>
            <!-- Free Input -->
            <div class="bg-gray-800 rounded-3xl p-6 shadow-lg border border-gray-700/50">
                <h2 class="text-lg font-bold mb-4 text-gray-200 flex justify-between items-end">
                    <span>フリー登録</span>
                    <span class="text-xs font-normal text-gray-400 uppercase tracking-widest">Other Drinks</span>
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <input type="text" id="free-name" placeholder="飲み物の名称 (例: 缶ビール)" class="w-full bg-gray-900 text-white rounded-xl p-3.5 border border-gray-700 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none transition-colors placeholder-gray-600">
                    </div>
                    <div class="flex gap-4">
                        <div class="flex-1 relative">
                            <input type="number" id="free-abv" placeholder="度数" class="w-full bg-gray-900 text-white rounded-xl p-3.5 border border-gray-700 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none transition-colors placeholder-gray-600">
                            <span class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 text-sm font-bold">%</span>
                        </div>
                        <div class="flex-1 relative">
                            <input type="number" id="free-vol" placeholder="量" class="w-full bg-gray-900 text-white rounded-xl p-3.5 border border-gray-700 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none transition-colors placeholder-gray-600">
                            <span class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 text-sm font-bold">ml</span>
                        </div>
                    </div>
                    <button id="btn-free-add" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3.5 rounded-xl transition-colors flex items-center justify-center gap-2 mt-2">
                        <i class="fa-solid fa-plus"></i> 追加する
                    </button>
                </div>
            </div>
        </section>

        <!-- SECTION 2: Today -->
        <section id="section-today" class="tab-content h-full flex flex-col">
            <!-- Today Summary -->
            <div class="bg-gray-800 rounded-3xl p-6 shadow-lg border border-gray-700/50 mb-6 flex-shrink-0 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
                <div class="text-sm font-semibold text-gray-400 mb-4 text-center" id="today-date-display">...</div>
                <div class="flex justify-around items-center">
                    <div class="text-center w-1/2">
                        <div class="text-xs text-gray-500 mb-1 font-semibold uppercase tracking-wider">総摂取量</div>
                        <div class="text-3xl font-extrabold text-white"><span id="today-total-vol">0</span><span class="text-sm text-gray-500 font-normal ml-1">ml</span></div>
                    </div>
                    <div class="w-px h-12 bg-gray-700"></div>
                    <div class="text-center w-1/2">
                        <div class="text-xs text-amber-500 mb-1 font-semibold uppercase tracking-wider">純アルコール</div>
                        <div class="text-4xl font-extrabold drop-shadow-[0_0_8px_rgba(0,0,0,0.3)]"><span id="today-total-pure" class="text-amber-400 transition-colors duration-300">0.0</span><span class="text-sm text-gray-500 font-normal ml-1">g</span></div>
                    </div>
                </div>
                
                <!-- Status Message Container -->
                <div id="today-status-msg" class="text-xs text-center mt-5 font-bold transition-colors duration-300 leading-relaxed bg-gray-900/50 p-2.5 rounded-xl border border-gray-700/50">
                    🥃 今日も良いお酒を。
                </div>
            </div>

            <div class="flex-grow">
                <h3 class="text-xs font-bold text-gray-500 mb-3 ml-2 uppercase tracking-widest">今日の履歴</h3>
                <div id="today-list" class="space-y-3 pb-4">
                    <!-- Logs generated by JS -->
                </div>
            </div>
        </section>

        <!-- SECTION 3: History -->
        <section id="section-history" class="tab-content">
            <h2 class="text-xl font-extrabold mb-6 text-center text-gray-200">過去30日間の記録</h2>
            <div id="history-list" class="space-y-5 pb-4">
                <!-- History grouped by day generated by JS -->
            </div>
        </section>

        <!-- Toast Notification -->
        <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-amber-400 border border-amber-500/50 px-6 py-3 rounded-full font-bold shadow-[0_5px_15px_rgba(0,0,0,0.5)] opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2">
            <i class="fa-solid fa-check-circle"></i> <span id="toast-msg">記録しました！</span>
        </div>

        <!-- Custom Delete Confirmation Modal -->
        <div id="delete-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200 backdrop-blur-sm">
            <div id="delete-modal-content" class="bg-gray-800 rounded-3xl p-6 shadow-2xl border border-gray-700 w-11/12 max-w-xs transform scale-95 transition-transform duration-200">
                <div class="text-red-500 text-4xl mb-3 text-center drop-shadow-[0_0_8px_rgba(239,68,68,0.5)]">
                    <i class="fa-solid fa-trash-can"></i>
                </div>
                <h3 class="text-lg font-bold text-white text-center mb-1">記録を削除しますか？</h3>
                <p class="text-gray-400 text-xs text-center mb-6">この操作は取り消せません。</p>
                <div class="flex gap-3">
                    <button id="btn-delete-no" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-xl transition-colors">NO</button>
                    <button id="btn-delete-yes" class="flex-1 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white font-bold py-3 rounded-xl transition-all shadow-[0_4px_15px_rgba(220,38,38,0.3)]">YES</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-gray-800/95 backdrop-blur-md border-t border-gray-700/50 pt-2 pb-5 absolute bottom-0 w-full z-30 flex-shrink-0 shadow-[0_-4px_10px_rgba(0,0,0,0.2)]">
        <div class="flex justify-around max-w-md mx-auto">
            <button class="nav-btn active flex flex-col items-center justify-center p-2 w-20" data-target="section-home">
                <i class="fa-solid fa-flask text-2xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">Home</span>
            </button>
            <button class="nav-btn flex flex-col items-center justify-center p-2 w-20" data-target="section-today">
                <i class="fa-solid fa-list-ul text-2xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">Today</span>
            </button>
            <button class="nav-btn flex flex-col items-center justify-center p-2 w-20" data-target="section-history">
                <i class="fa-solid fa-calendar-days text-2xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">History</span>
            </button>
        </div>
    </nav>

    <script>
        // Global State & Local Storage Setup
        const STORAGE_KEY = 'highball_logs_data';
        let drinksData = [];
        let itemToDeleteId = null; // Stores ID temporarily for the modal

        // Generate a unique ID for each log entry
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        // Calculate Pure Alcohol: Volume(ml) * (ABV/100) * 0.8
        function calcPureAlcohol(vol, abv) {
            return (vol * (abv / 100) * 0.8).toFixed(1);
        }

        // Logical Day Logic (Day starts at 06:00, ends at 05:59 next day)
        function getLogicalDateStr(dateObj = new Date()) {
            const d = new Date(dateObj);
            d.setHours(d.getHours() - 6);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
        
        function formatDisplayDate(logicalDateStr) {
            const parts = logicalDateStr.split('-');
            if(parts.length !== 3) return logicalDateStr;
            return `${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日`;
        }

        function formatTime(timestamp) {
            const d = new Date(timestamp);
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    drinksData = JSON.parse(raw);
                } catch(e) {
                    console.error("Local storage parsing error", e);
                    drinksData = [];
                }
            }

            // Cleanup old records (older than 30 days)
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            const cutoffLogicalDate = getLogicalDateStr(thirtyDaysAgo);

            const originalLength = drinksData.length;
            drinksData = drinksData.filter(log => log.logicalDay >= cutoffLogicalDate);
            
            // Sort by newest first
            drinksData.sort((a, b) => b.timestamp - a.timestamp);

            if (drinksData.length !== originalLength) {
                saveData(); // Save cleaned up array
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(drinksData));
            renderToday();
            renderHistory();
        }

        function addDrink(name, abv, vol, type) {
            const pure = parseFloat(calcPureAlcohol(vol, abv));
            const timestamp = Date.now();
            const logicalDay = getLogicalDateStr(timestamp);

            const drinkData = {
                id: generateId(),
                name: name,
                abv: parseFloat(abv),
                vol: parseFloat(vol),
                pureAlc: pure,
                timestamp: timestamp,
                logicalDay: logicalDay,
                type: type // 'highball' or 'free'
            };

            drinksData.unshift(drinkData); // Add to beginning of array
            saveData();
            showToast("記録しました！");
        }

        function deleteDrink(id) {
            drinksData = drinksData.filter(drink => drink.id !== id);
            saveData();
            showToast("削除しました");
        }
function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            
            if(isError) {
                toast.classList.remove('text-amber-400', 'border-amber-500/50');
                toast.classList.add('text-red-400', 'border-red-500/50');
                toast.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span id="toast-msg">${message}</span>`;
            } else {
                toast.classList.remove('text-red-400', 'border-red-500/50');
                toast.classList.add('text-amber-400', 'border-amber-500/50');
                toast.innerHTML = `<i class="fa-solid fa-check-circle"></i> <span id="toast-msg">${message}</span>`;
            }

            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 0) scale(1)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -10px) scale(0.95)';
            }, 2500);
        }

        // Custom Modal Logic
        const modal = document.getElementById('delete-modal');
        const modalContent = document.getElementById('delete-modal-content');
        
        function openDeleteModal(id) {
            itemToDeleteId = id;
            modal.classList.add('modal-active');
            modalContent.classList.add('modal-scale-active');
        }

        function closeDeleteModal() {
            itemToDeleteId = null;
            modal.classList.remove('modal-active');
            modalContent.classList.remove('modal-scale-active');
        }

        document.getElementById('btn-delete-no').addEventListener('click', closeDeleteModal);
        document.getElementById('btn-delete-yes').addEventListener('click', () => {
            if (itemToDeleteId) {
                deleteDrink(itemToDeleteId);
            }
            closeDeleteModal();
        });

        // Makes openDeleteModal available globally for inline onclick handlers
        window.openDeleteModal = openDeleteModal;

        // Tab Switching
        const navBtns = document.querySelectorAll('.nav-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                
                navBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                tabContents.forEach(tab => {
                    if (tab.id === targetId) tab.classList.add('active');
                    else tab.classList.remove('active');
                });
            });
        });

        // Calculator Logic
        const sWAbv = document.getElementById('slider-w-abv');
        const sWVol = document.getElementById('slider-w-vol');
        const sSVol = document.getElementById('slider-s-vol');
        
        const vWAbv = document.getElementById('val-w-abv');
        const vWVol = document.getElementById('val-w-vol');
        const vSVol = document.getElementById('val-s-vol');
        
        const dAbv = document.getElementById('calc-abv-display');
        const dTotal = document.getElementById('calc-total-display');
        const dPure = document.getElementById('calc-pure-display');

        function updateCalculator() {
            const wAbv = parseFloat(sWAbv.value);
            const wVol = parseFloat(sWVol.value);
            const sVol = parseFloat(sSVol.value);

            vWAbv.innerText = wAbv;
            vWVol.innerText = wVol;
            vSVol.innerText = sVol;

            const totalVol = wVol + sVol;
            const finalAbv = ((wVol * wAbv) / totalVol).toFixed(1);
            const pureAlc = calcPureAlcohol(totalVol, finalAbv);

            dAbv.innerHTML = `${finalAbv} <span class="text-xl font-normal text-gray-400">%</span>`;
            dTotal.innerText = totalVol;
            dPure.innerText = pureAlc;
        }

        [sWAbv, sWVol, sSVol].forEach(el => el.addEventListener('input', updateCalculator));

        // Save Triggers
        document.getElementById('btn-craft').addEventListener('click', () => {
            const wAbv = parseFloat(sWAbv.value);
            const wVol = parseFloat(sWVol.value);
            const sVol = parseFloat(sSVol.value);
            const totalVol = wVol + sVol;
            const finalAbv = ((wVol * wAbv) / totalVol).toFixed(1);
            
            addDrink("自家製ハイボール", finalAbv, totalVol, 'highball');
        });

        document.getElementById('btn-free-add').addEventListener('click', () => {
            let name = document.getElementById('free-name').value.trim();
            const abv = document.getElementById('free-abv').value;
            const vol = document.getElementById('free-vol').value;
            
            if(!name) name = "名もなき酒";
            if(!abv || !vol) {
                showToast("度数と量を入力してください", true);
                return;
            }
            
            addDrink(name, abv, vol, 'free');
            document.getElementById('free-name').value = '';
            document.getElementById('free-abv').value = '';
            document.getElementById('free-vol').value = '';
        });

        function renderToday() {
            const todayLogicalStr = getLogicalDateStr();
            const todayLogs = drinksData.filter(log => log.logicalDay === todayLogicalStr);
            
            let todayVol = 0;
            let todayPure = 0;
            const todayListEl = document.getElementById('today-list');
            todayListEl.innerHTML = '';

            document.getElementById('today-date-display').innerText = formatDisplayDate(todayLogicalStr) + " (本日)";

            if (todayLogs.length === 0) {
                todayListEl.innerHTML = '<div class="text-center text-gray-600 py-10 font-bold"><i class="fa-solid fa-glass-water text-3xl mb-3 block"></i>まだ記録がありません</div>';
            } else {
                todayLogs.forEach(log => {
                    todayVol += log.vol;
                    todayPure += log.pureAlc;
                    
                    const isHighball = log.type === 'highball';
                    const iconColor = isHighball ? 'text-amber-500' : 'text-blue-400';
                    const iconClass = isHighball ? 'fa-martini-glass-citrus' : 'fa-beer-mug-empty';
                    const bgAccent = isHighball ? 'bg-amber-500/10' : 'bg-blue-500/10';
                    
                    // Added a delete trash button
                    todayListEl.innerHTML += `
                        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700/50 flex items-center justify-between shadow-sm relative overflow-hidden group">
                            <div class="absolute inset-0 ${bgAccent} opacity-50"></div>
                            <div class="flex items-center gap-4 relative z-10">
                                <div class="w-12 h-12 rounded-full bg-gray-900 border border-gray-700 flex items-center justify-center text-xl shadow-inner">
                                    <i class="fa-solid ${iconClass} ${iconColor}"></i>
                                </div>
                                <div>
                                    <div class="text-sm font-bold text-gray-200">${log.name}</div>
                                    <div class="text-xs font-semibold text-gray-500 mt-0.5">${formatTime(log.timestamp)} • ${log.abv}% • ${log.vol}ml</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-3 relative z-10">
                                <div class="text-right">
                                    <div class="text-lg font-black text-amber-400">${log.pureAlc.toFixed(1)}g</div>
                                    <div class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Alc</div>
                                </div>
                                <!-- Delete Button -->
                                <button onclick="window.openDeleteModal('${log.id}')" class="del-btn w-8 h-8 rounded-full bg-gray-700 hover:bg-red-500/20 text-gray-400 hover:text-red-400 flex items-center justify-center border border-transparent hover:border-red-500/50">
                                    <i class="fa-solid fa-trash-can text-sm"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('today-total-vol').innerText = todayVol;
            
            // Apply alcohol amount evaluation logic
            const pureDisplay = document.getElementById('today-total-pure');
            const statusMsg = document.getElementById('today-status-msg');
            
            pureDisplay.innerText = todayPure.toFixed(1);
            
            // Reset classes
            pureDisplay.className = "transition-colors duration-300";
            statusMsg.className = "text-xs text-center mt-5 font-bold transition-colors duration-300 leading-relaxed bg-gray-900/50 p-2.5 rounded-xl border border-gray-700/50";
            
            if (todayPure < 20) {
                // Under 20g (Safe)
                pureDisplay.classList.add("text-amber-400");
                statusMsg.classList.add("text-gray-300");
                statusMsg.innerHTML = "🥃 今日も良いお酒を。";
            } else if (todayPure < 40) {
                // 20g or more, under 40g (Warning)
                pureDisplay.classList.add("text-orange-500");
                statusMsg.classList.add("text-orange-400", "border-orange-500/30", "bg-orange-900/20");
                statusMsg.innerHTML = "⚠️ 適量（20g）をオーバーしました。<br>チェイサーを挟んで、そろそろスローペースに。";
            } else {
                // 40g or more (Danger)
                pureDisplay.classList.add("text-red-500");
                statusMsg.classList.add("text-red-400", "border-red-500/30", "bg-red-900/20");
                statusMsg.innerHTML = "🛑 限界ライン（40g）到達！<br>本日のCraftはここまで。あとはゆっくり休みましょう。";
            }
        }

        function renderHistory() {
            const historyListEl = document.getElementById('history-list');
            historyListEl.innerHTML = '';
            
            const todayLogicalStr = getLogicalDateStr();
            const grouped = {};

            // Group by logical day
            drinksData.forEach(log => {
                if(!grouped[log.logicalDay]) grouped[log.logicalDay] = { pureTotal: 0, volTotal: 0, logs: [] };
                grouped[log.logicalDay].pureTotal += log.pureAlc;
                grouped[log.logicalDay].volTotal += log.vol;
                grouped[log.logicalDay].logs.push(log);
            });

            // Sort days descending
            const sortedDays = Object.keys(grouped).sort((a,b) => b.localeCompare(a));

            if (sortedDays.length === 0) {
                historyListEl.innerHTML = '<div class="text-center text-gray-600 py-10 font-bold"><i class="fa-solid fa-clock-rotate-left text-3xl mb-3 block"></i>過去の記録はありません</div>';
            } else {
                sortedDays.forEach(dayStr => {
                    const data = grouped[dayStr];
                    const dateDisplay = formatDisplayDate(dayStr);
                    const isToday = dayStr === todayLogicalStr;
                    
                    historyListEl.innerHTML += `
                        <div class="bg-gray-800 rounded-2xl overflow-hidden border ${isToday ? 'border-amber-500/30' : 'border-gray-700/50'} shadow-md">
                            <div class="bg-gray-900/80 p-4 border-b border-gray-700/50 flex justify-between items-center">
                                <div class="font-bold text-sm ${isToday ? 'text-amber-500' : 'text-gray-300'} flex items-center gap-2">
                                    <i class="fa-solid fa-calendar-day"></i>
                                    ${dateDisplay} ${isToday ? '<span class="text-xs bg-amber-500 text-gray-900 px-2 py-0.5 rounded-md ml-1">今日</span>' : ''}
                                </div>
                                <div class="text-right">
                                    <div class="text-lg font-black text-amber-400">${data.pureTotal.toFixed(1)}g</div>
                                </div>
                            </div>
                            <div class="p-3 bg-gray-800 text-xs text-gray-400 flex flex-wrap gap-2">
                                ${data.logs.map(l => {
                                    const c = l.type === 'highball' ? 'border-amber-500/30 text-amber-100 bg-amber-900/20' : 'border-blue-500/30 text-blue-100 bg-blue-900/20';
                                    // Added a mini 'x' icon in the tag to delete history items
                                    return `
                                    <span class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border ${c} shadow-sm pr-1">
                                        <span>${l.name} <span class="font-bold opacity-70 ml-1">${l.pureAlc.toFixed(1)}g</span></span>
                                        <button onclick="window.openDeleteModal('${l.id}')" class="del-btn text-gray-400 hover:text-red-400 w-5 h-5 flex items-center justify-center rounded-full hover:bg-black/30">
                                            <i class="fa-solid fa-xmark text-sm"></i>
                                        </button>
                                    </span>`;
                                }).join('')}
                            </div>
                        </div>
                    `;
                });
            }
        }

        // Initialize App
        updateCalculator();
        loadData(); // Loads local storage and renders

    </script>
</body>
</html>
